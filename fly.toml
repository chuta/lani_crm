app = "lani-crm-api"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PARTNERSHIP_HOST = "0.0.0.0"
  PARTNERSHIP_PORT = "8080"
  PIPELINE_DB_PATH = "/data/partnership-pipeline.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "40s"
    method = "GET"
    path = "/api/partnerships/health"

[[mounts]]
  source = "lani_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
